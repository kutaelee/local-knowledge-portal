source_roots:
  - id: wsl-repositories
    name: WSL repositories
    path: /home/YOUR_USER/src
    type: repositories
    read_only: true
    enabled: true
    include_patterns:
      - "**/*"
    exclude_patterns:
      - "local-knowledge-portal/**"

  - id: managed-vault
    name: Local Knowledge Portal managed vault
    path: /data/vault
    type: obsidian
    read_only: false
    enabled: true
    managed_subdirectory: _generated
    include_patterns:
      - "**/*.md"
    exclude_patterns:
      - "_generated/_retired/**"
