scanner:
  max_file_bytes: 10485760
  hash_chunk_bytes: 1048576
watcher:
  debounce_ms: 750
  force_polling: false
  polling_roots:
    - /data/vault
  poll_delay_ms: 2000
  cpu_warning_percent: 50
  cpu_warning_samples: 3
  cpu_grace_seconds: 60
  stability_wait_ms: 1000
reconciler:
  interval_seconds: 900
worker:
  heartbeat_seconds: 10
  stale_after_seconds: 45
  lease_seconds: 120
  max_attempts: 5
  retry_base_seconds: 2
  embedding_batch_size: 2
  embedding_batch_cooldown_seconds: 0.5
  embedding_max_chunks_per_document: 128
  embedding_max_chars_per_document: 250000
  job_cooldown_seconds: 1
  burst_jobs: 20
  burst_cooldown_seconds: 15
  pause_file: "/data/runtime/embedding.pause"
chunking:
  max_chars: 6000
  overlap_lines: 8
  parser_version: "markdown-it-py-4"
  chunker_version: "lkp-heading-symbol-v1"
pipeline:
  version: "1.1.0"
  knowledge_value_policy: "deterministic-knowledge-value-v1"
codex_capture:
  enabled: false
generation:
  provider: "disabled"
  base_url: "http://ollama:11434"
  model: ""
  model_digest: "unresolved"
  timeout_seconds: 120
  max_input_chars: 40000
  output: "/data/vault/_generated/summaries"
  required_for_ingestion: false
search:
  default_top_k: 10
  minimum_similarity: 0.2
  rrf_k: 60
