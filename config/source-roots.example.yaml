source_roots:
  - id: windows-repositories
    name: Windows repositories
    # Mount C:\Dev\Repos read-only at this container path.
    path: "/sources/windows-repositories"
    # Scan direct child Git repositories only; unrelated directories are not
    # traversed. Newly added Git repositories are discovered next reconcile.
    type: repository_collection
    read_only: true
    # Docker Desktop bind mounts can make recursive polling expensive. A
    # bounded hourly reconciliation discovers newly added repositories without
    # keeping one polling watcher per repository.
    watch_mode: disabled
    reconcile_interval_seconds: 3600
    startup_reconcile: true
    include_patterns:
      - "**/*"
    exclude_patterns:
      - "local-knowledge-portal/**"

  - id: managed-vault
    name: Managed fallback vault
    path: "/data/vault"
    type: obsidian
    read_only: false
    watch_mode: polling
    reconcile_interval_seconds: 900
    managed_subdirectory: "_generated"
    include_patterns:
      - "**/*.md"
    exclude_patterns:
      - "_generated/Runbooks/**"
      - "_generated/_retired/**"
