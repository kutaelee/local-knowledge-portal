[project]
name = "local-knowledge-portal"
version = "0.1.0"
description = "Local-first, provenance-preserving knowledge portal"
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "markdown-it-py==4.0.0",
  "pathspec==0.12.1",
  "pgvector==0.4.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "python-frontmatter==1.1.0",
  "pyyaml==6.0.3",
  "sqlalchemy==2.0.51",
  "structlog==25.5.0",
  "tenacity==9.1.2",
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==0.13.0",
  "uvicorn[standard]==0.41.0",
  "watchfiles==1.1.1",
]

[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7",
  "testcontainers[postgres]==4.14.1",
]

[tool.setuptools.packages.find]
where = ["services/api", "services/indexer"]
include = ["lkp*", "lkp_indexer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017", "UP042", "UP043"]
